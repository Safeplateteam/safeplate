name: Free PGs from OpenStreetMap
on:
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Dry run (count only, add nothing)', type: boolean, default: true }
jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scraper/osm_import.py
        env:
          SCRAPER_KEY: ${{ secrets.SCRAPER_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
